included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Sources/SparkSDK/Proto       # Generated protobuf code
  - Sources/SparkSDK/Frost       # Generated UniFFI bindings
  - Sources/SparkSDK/GraphQL     # GraphQL string constants
  - Frameworks

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace

opt_in_rules:
  - force_unwrapping
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 800
  error: 1500

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 200

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - w
    - r
    - g
    - b
    - a
    - i
    - j
    - k
    - n
    - tx
    - to

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

# Force unwraps are tolerated in tests but strongly discouraged in Sources.
force_cast:
  severity: error
force_try:
  severity: warning
force_unwrapping:
  severity: warning

reporter: "xcode"
