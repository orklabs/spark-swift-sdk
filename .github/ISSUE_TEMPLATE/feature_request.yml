name: Feature request
description: Suggest a new capability or improvement to SparkSDK.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What's blocking you with the current API?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like SparkSDK to solve this? Sketch a Swift API if you can.
      render: swift
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other libraries, or designs you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use case, links to similar APIs in other SDKs, etc.
