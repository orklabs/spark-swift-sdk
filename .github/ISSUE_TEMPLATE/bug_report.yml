name: Bug report
description: Report a defect, crash, or incorrect behavior in SparkSDK.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        > ⚠️ **Security issues should NOT be filed here.** Please follow [SECURITY.md](https://github.com/p-i-g-g-y/spark-swift-sdk/blob/main/SECURITY.md) for private disclosure.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the issue.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, runnable code or a sequence of API calls that triggers the issue.
      render: swift
      placeholder: |
        let wallet = try SparkWallet(mnemonic: "...")
        await wallet.start()
        // ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and any relevant logs (redact mnemonics, keys, transaction details that link to your wallet).
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SparkSDK version
      placeholder: "0.1.0 or commit hash"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS device
        - iOS simulator
        - macOS
        - Mac Catalyst
        - visionOS
        - other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "iOS 18.2 / macOS 15.2"
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode / Swift version
      placeholder: "Xcode 16.2, Swift 6.0"

  - type: dropdown
    id: network
    attributes:
      label: Spark network
      options:
        - mainnet
        - regtest
        - other / custom
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — workarounds tried, suspected cause, related issues.
